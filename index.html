<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Schemax - Story & Lore Studio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN for instant zero-build execution -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              serif: ['Lora', 'Georgia', 'serif'],
            },
            colors: {
              brand: {
                50: '#fffbeb',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
              }
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #030712;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }

      .safe-top {
        padding-top: max(0.75rem, var(--safe-top));
      }

      .safe-bottom {
        padding-bottom: max(0.75rem, var(--safe-bottom));
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Rich Text Editor Styling */
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #64748b;
        cursor: text;
        pointer-events: none;
      }

      [contenteditable] {
        outline: none;
      }

      [contenteditable] h2 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        color: #f1f5f9;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 0.25rem;
      }

      [contenteditable] h3 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        color: #fbbf24;
      }

      [contenteditable] p {
        margin-bottom: 1.15rem;
        line-height: 1.85;
      }

      [contenteditable] blockquote {
        border-left: 3px solid #f59e0b;
        padding-left: 1rem;
        margin: 1.25rem 0;
        font-style: italic;
        color: #fde68a;
        background: rgba(245, 158, 11, 0.05);
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        border-radius: 0 0.5rem 0.5rem 0;
      }

      [contenteditable] ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }

      [contenteditable] ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }

      [contenteditable] hr {
        border: 0;
        height: 1px;
        background-image: linear-gradient(to right, transparent, rgba(245, 158, 11, 0.5), transparent);
        margin: 2rem 0;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="app-root" class="min-h-screen flex flex-col">
      <!-- Loading State -->
      <div class="flex-1 flex flex-col items-center justify-center min-h-screen">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mb-3 animate-pulse">
          <svg class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        </div>
        <p class="text-xs font-semibold text-slate-400 tracking-wider">Memuat Schemax Studio...</p>
      </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Application Script -->
    <script src="app.js"></script>
  </body>
</html>
