<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
    <title>Schemax - Story & Lore Studio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
      // Instant zero-flicker theme loader
      (function() {
        try {
          var saved = localStorage.getItem('schemax_theme_mode') || 'dark';
          var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      html.dark body {
        background-color: #030712;
        color: #f8fafc;
      }

      .safe-top {
        padding-top: max(0.75rem, var(--safe-top));
      }

      .safe-bottom {
        padding-bottom: max(0.75rem, var(--safe-bottom));
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Rich Text Editor Styling */
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #94a3b8;
        cursor: text;
        pointer-events: none;
      }
      html.dark [contenteditable]:empty:before {
        color: #64748b;
      }

      [contenteditable] {
        outline: none;
      }

      [contenteditable] h2 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        color: #0f172a;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        padding-bottom: 0.25rem;
      }
      html.dark [contenteditable] h2 {
        color: #f1f5f9;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      [contenteditable] h3 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        color: #b45309;
      }
      html.dark [contenteditable] h3 {
        color: #fbbf24;
      }

      [contenteditable] p {
        margin-bottom: 1.15rem;
        line-height: 1.85;
      }

      [contenteditable] blockquote {
        border-left: 3px solid #d97706;
        padding-left: 1rem;
        margin: 1.25rem 0;
        font-style: italic;
        color: #92400e;
        background: rgba(245, 158, 11, 0.08);
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        border-radius: 0 0.5rem 0.5rem 0;
      }
      html.dark [contenteditable] blockquote {
        border-left-color: #f59e0b;
        color: #fde68a;
        background: rgba(245, 158, 11, 0.05);
      }

      [contenteditable] ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }

      [contenteditable] ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }

      [contenteditable] hr {
        border: 0;
        height: 1px;
        background-image: linear-gradient(to right, transparent, rgba(245, 158, 11, 0.5), transparent);
        margin: 2rem 0;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased selection:bg-amber-500/30 selection:text-amber-800 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
